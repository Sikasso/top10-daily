<style>
/* Same hanging enamel sign as the NBA "CLOSED" board (styles.css .door/.hang/.sign), reworded. */
:root{color-scheme:dark;--bg:#0a0d12;--sans:Archivo,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 40% -20%,#243346,transparent 55%),var(--bg);color:#edf2f7;font-family:var(--sans);-webkit-font-smoothing:antialiased}
.door{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:760px;padding:42px 24px 34px;min-height:470px;border:1px solid #463c2b;border-radius:12px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 40%,#202229 0,#14161b 60%,#0c0e12 100%);box-shadow:inset 0 0 0 1px #ffffff08,inset 0 0 70px #0009,0 16px 40px #0006}
.door:before{content:"";position:absolute;inset:20px;border:1px solid #292a2c;border-radius:6px;box-shadow:inset 0 0 0 1px #ffffff05,0 0 0 1px #08090b;pointer-events:none}
.hang{display:flex;flex-direction:column;align-items:center;transform-origin:50% 8px;animation:swing 4.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.strings{width:300px;max-width:78vw;height:64px;display:block;margin-bottom:-2px;overflow:visible}
.strings line{stroke:#bb9650;stroke-width:2.2;stroke-linecap:round}
.strings circle{fill:#d8b566;stroke:#705629;stroke-width:2}
.sign{position:relative;width:360px;max-width:82vw;padding:22px 24px 16px;border:1px solid #e0c176;border-radius:5px;text-align:center;display:flex;flex-direction:column;gap:5px;z-index:1;
 color:#eee5d0;background:linear-gradient(145deg,#1b1c1d,#08090a 62%,#171717);box-shadow:inset 0 0 0 4px #08090a,inset 0 0 0 6px #ad8949,inset 0 0 0 8px #24211a,0 16px 32px #000b}
.sign::before,.sign::after{content:"";position:absolute;top:12px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe5a1,#a27b36 60%,#44351d);box-shadow:0 0 4px #e2c57866}
.sign::before{left:14px}.sign::after{right:14px}
.sign-top,.sign-sub{font:600 10px var(--sans);letter-spacing:.24em;color:#c9ac6b}
.sign-main{font-family:var(--sans);font-stretch:70%;font-weight:900;font-size:44px;line-height:1.02;letter-spacing:.09em;text-transform:uppercase;color:#f3ead4;text-shadow:0 2px 10px #d6b05c28}
.sign-arrow{width:31px;height:31px;align-self:center;margin-top:9px;fill:none;stroke:#c8a75f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{position:relative;z-index:1;margin:24px 0 0;color:#b9b6ad;font-size:15px;text-align:center;letter-spacing:.025em;line-height:1.5}
.four{color:#f5d08a;text-shadow:0 0 24px rgba(217,162,75,.35)}
.go{position:relative;z-index:1;overflow:hidden;isolation:isolate;margin-top:20px;display:inline-block;color:#0a0d12;background:#f5d08a;font-weight:800;font-size:16px;text-decoration:none;padding:13px 26px;border-radius:999px;box-shadow:0 0 22px rgba(217,162,75,.3)}
.go:hover{filter:brightness(1.06)}
.go::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,250,235,.8),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,72%{left:-60%}90%,100%{left:130%}}
a:focus-visible{outline:2px solid #f5d08a;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.hang{animation:none}.go::after{display:none}}
@media(max-width:700px){.door{min-height:420px;padding:34px 16px 28px}.door:before{inset:12px}.sign-main{font-size:36px}}
</style></head>
<body><main class="door" role="img" aria-label="A black enamel sign hanging on a locker-room wall: Top10 Daily is moving on up to The FOURcast.">

<div class="sign"><span class="sign-top">TOP10 DAILY IS</span><span class="sign-main">Moving<br>on up</span><span class="sign-sub">NOW THE FOURCAST</span><svg class="sign-arrow" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16"/><path d="M20 28V12M13 19l7-7 7 7"/></svg></div></div>
